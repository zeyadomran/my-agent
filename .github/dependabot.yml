version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    # Match Node types to the supported runtime; keep TypeScript 6 until lint supports 7.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
      - dependency-name: '@types/node'
        versions: ['>=23']
    schedule:
      interval: weekly
      day: monday
      time: '13:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
      lint-and-format:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'eslint-*',
            'typescript-eslint',
            'prettier',
            'globals',
            'lint-staged',
          ]
      build-tooling:
        patterns: ['electron', '@electron/*', 'electron-vite', 'vite', '@vitejs/*']
      remaining-npm:
        patterns: ['*']
    commit-message:
      prefix: build
